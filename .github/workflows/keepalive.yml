# Keeps the Supabase Free-tier projects from auto-pausing (7-day inactivity rule)
# by generating a small amount of real API activity every day.
# The anon keys below are PUBLIC by design (they ship in the frontend bundles;
# RLS protects all data). Delete this workflow after migrating off Supabase.
name: Supabase Keep-Alive
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping hermes
        run: |
          curl -sf 'https://oddczcritnsiahruqqaw.supabase.co/rest/v1/projects?select=id&limit=1' \
            -H 'apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kZGN6Y3JpdG5zaWFocnVxcWF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxNDUxODksImV4cCI6MjA4MzcyMTE4OX0.jKUP83Qn0SZH6RykVn3UNid68vVyNTUgRcts1DXIuVY' -o /dev/null
      - name: Ping ego
        run: |
          curl -sf 'https://ajzyepdyhgymticrqywz.supabase.co/rest/v1/profiles?select=id&limit=1' \
            -H 'apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqenllcGR5aGd5bXRpY3JxeXd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzOTEzMzAsImV4cCI6MjA4NTk2NzMzMH0.IG0gqWbkixv601rmxZC0MhDrUrvEsK4_xAq0MB2Ymxw' -o /dev/null
